# Render.com deployment spec — Backend (FastAPI) + PostgreSQL
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: visioncare-db
    databaseName: visioncare
    user: visioncare
    plan: free

services:
  - type: web
    name: visioncare-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secure random value
      - key: DATABASE_URL
        fromDatabase:
          name: visioncare-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://visioncare-ai.vercel.app,http://localhost:3000
      - key: NOTIFICATIONS_ENABLED
        value: "false"
      - key: EAR_THRESHOLD
        value: "0.21"
      - key: MAR_THRESHOLD
        value: "0.6"
      - key: CONSECUTIVE_FRAMES_ALERT
        value: "15"
    healthCheckPath: /health
